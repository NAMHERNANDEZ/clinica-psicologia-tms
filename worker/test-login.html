<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Test - Clinica TMS</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow: auto; max-height: 300px; }
    .token { word-break: break-all; }
  </style>
</head>
<body>
  <h1>🔐 Login Test - Clinica TMS API</h1>
  <p>API: <code>https://clinica-tms-api.terapiamagneticatranscraneal.workers.dev</code></p>
  
  <form id="loginForm">
    <div class="form-group">
      <label>Email:</label>
      <input type="email" id="email" value="admin@clinica.com" required>
    </div>
    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="password" value="Admin123!" required>
    </div>
    <button type="submit" id="btnLogin">Iniciar Sesión</button>
  </form>

  <div id="result"></div>

  <script>
    const API_BASE = 'https://clinica-tms-api.terapiamagneticatranscraneal.workers.dev';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.textContent = 'Iniciando sesión...';
      result.style.display = 'none';
      
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const response = await fetch('https://clinica-tms-api.terapiamagneticatranscraneal.workers.dev/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        
        const token = data.data.accessToken;
        localStorage.setItem('clinica_token', token);
        
        // Test protected endpoint
        const healthResponse = await fetch('https://clinica-tms-api.terapiamagneticatranscraneal.workers.dev/api/health', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const healthData = await healthResponse.json();
        
        result.className = 'success';
        result.innerHTML = `
          <h3>✅ Login exitoso</h3>
          <p><strong>Usuario:</strong> ${data.data.user.email} (${data.data.user.role})</p>
          <p><strong>Token guardado en localStorage</strong></p>
          <h4>Test /api/health:</h4>
          <pre class="token">${JSON.stringify(healthData, null, 2)}</pre>
          <hr>
          <h4>Endpoints disponibles:</h4>
          <ul>
            <li><a href="#" onclick="testEndpoint('/api/observability/dashboard')">/api/observability/dashboard</a></li>
            <li><a href="#" onclick="testEndpoint('/api/security/dashboard')">/api/security/dashboard</a></li>
            <li><a href="#" onclick="testEndpoint('/api/performance/dashboard')">/api/performance/dashboard</a></li>
            <li><a href="#" onclick="testEndpoint('/api/cron/dashboard')">/api/cron/dashboard</a></li>
            <li><a href="#" onclick="testEndpoint('/api/compliance/dashboard')">/api/compliance/dashboard</a></li>
            <li><a href="#" onclick="testEndpoint('/api/security/dashboard')">/api/security/dashboard</a></li>
          </ul>
        `;
        result.style.display = 'block';
        
      } catch (err) {
        result.className = 'error';
        result.innerHTML = `<h3>❌ Error</h3><p>${err.message}</p>`;
        result.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
    
    async function testEndpoint(path) {
      const token = localStorage.getItem('clinica_token');
      if (!token) return alert('Primero inicia sesión');
      
      try {
        const res = await fetch(`https://clinica-tms-api.terapiamagneticatranscraneal.workers.dev${path}`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('clinica_token')}` }
        });
        const data = await res.json();
        alert(`${path}: ${res.ok ? '✅ OK' : '❌ Error'}\n\n${JSON.stringify(data, null, 2)}`);
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
      return false;
    }
  </script>
</body>
</html>
